<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affichage TV FABMEC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#081624;color:#fff}
body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr 44px}
.top,.bottom{display:flex;align-items:center;justify-content:space-between;background:#0b1f33;padding:0 16px;transition:opacity .35s}
.title{font-size:21px;font-weight:900}
.small{font-size:12px;color:#b8c8d5}
.right{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:9px;padding:8px 11px;background:#dfeaf1;color:#0b1f33;font-weight:800;cursor:pointer}
.btn.primary{background:#2ea7e0;border:2px solid #fff}
.main{position:relative;min-height:0;padding:10px}
.hero{
  position:absolute;inset:10px;border-radius:16px;overflow:hidden;
  background:
    linear-gradient(rgba(5,17,29,.22),rgba(5,17,29,.22)),
    url("steel_blueprint_bg.png") center/cover no-repeat,
    #0b1f33;
}
.hero:before,.hero:after{content:none}
.slide{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .7s}
.slide.active{opacity:1}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:rgba(11,31,51,.35)}
.placeholder h1{font-size:48px;margin:0 0 10px}
.caption{position:absolute;left:16px;bottom:14px;background:rgba(0,0,0,.55);padding:7px 11px;border-radius:8px;font-size:12px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{position:absolute;z-index:50;top:18px;right:18px;width:270px;background:rgba(16,44,69,.98);border-radius:14px;padding:14px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.panel.open{display:block}
.info{margin-top:10px;background:rgba(255,255,255,.07);border-radius:10px;padding:9px}
.big{font-size:22px;font-weight:900}
.auto-hide .top,.auto-hide .bottom{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div>
    <div class="title">AFFICHAGE TV FABMEC</div>
    <div class="small">Photos chantier • diffusion aléatoire • fond plan structure acier</div>
  </div>
  <div class="right">
    <span id="clock"></span>
    <button class="btn primary" id="fullBtn">⛶ PLEIN ÉCRAN</button>
    <button class="btn" id="menuBtn">☰ MENU</button>
  </div>
</header>

<main class="main">
  <section class="hero" id="hero">
    <div class="placeholder"><div><h1>FABMEC</h1><p>Chargement automatique des photos...</p></div></div>
  </section>

  <aside class="panel" id="panel">
    <b>Réglages</b>
    <div class="info">
      <div class="small">Photos détectées</div>
      <div class="big" id="count">0</div>
    </div>
    <div class="info">
      <div class="small">Mode</div>
      <b>Aléatoire intelligent</b>
    </div>
    <div class="info">
      <div class="small">Dernière vérification</div>
      <span id="lastRefresh">--</span>
    </div>
    <button class="btn primary" id="refreshBtn" style="width:100%;margin-top:12px">↻ Actualiser</button>
    <button class="btn" id="closeBtn" style="width:100%;margin-top:8px">Fermer</button>
  </aside>
</main>

<footer class="bottom">
  <span class="small" id="status">Connexion...</span>
  <div>
    <button class="btn" id="prevBtn">◀</button>
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn" id="nextBtn">▶</button>
  </div>
</footer>
</div>

<script>
const API='https://api.github.com/repos/Antobelle/affichage-tv-fabmec/contents/photos?ref=main';

const hero=document.getElementById('hero');
const count=document.getElementById('count');
const status=document.getElementById('status');
const lastRefresh=document.getElementById('lastRefresh');
const panel=document.getElementById('panel');
const menuBtn=document.getElementById('menuBtn');
const closeBtn=document.getElementById('closeBtn');
const refreshBtn=document.getElementById('refreshBtn');
const fullBtn=document.getElementById('fullBtn');
const pauseBtn=document.getElementById('pauseBtn');
const nextBtn=document.getElementById('nextBtn');
const prevBtn=document.getElementById('prevBtn');
const clock=document.getElementById('clock');

let items=[],order=[],pos=0,lastIndex=-1,slideTimer=null,playing=true,signature='',uiTimer=null;

function updateClock(){
  clock.textContent=new Date().toLocaleString('fr-CA',{dateStyle:'medium',timeStyle:'short'});
}
setInterval(updateClock,1000);
updateClock();

function shuffleCycle(){
  let arr=items.map((_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  if(arr.length>1 && arr[0]===lastIndex){
    [arr[0],arr[1]]=[arr[1],arr[0]];
  }
  order=arr;
  pos=0;
}

function showCurrent(){
  if(!items.length)return;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  const idx=order[pos];
  const slide=document.getElementById('slide-'+idx);
  if(slide)slide.classList.add('active');
  lastIndex=idx;
}

function render(){
  hero.innerHTML='';
  if(!items.length){
    hero.innerHTML='<div class="placeholder"><div><h1>FABMEC</h1><p>Aucune image trouvée dans le dossier photos.</p></div></div>';
    return;
  }
  items.forEach((item,i)=>{
    const s=document.createElement('div');
    s.className='slide';
    s.id='slide-'+i;
    s.style.backgroundImage='url("'+item.url+'")';
    const c=document.createElement('div');
    c.className='caption';
    c.textContent=item.name;
    s.appendChild(c);
    hero.appendChild(s);
  });
  lastIndex=-1;
  shuffleCycle();
  showCurrent();
  restartSlideshow();
}

function next(){
  if(!items.length)return;
  pos++;
  if(pos>=order.length)shuffleCycle();
  showCurrent();
}

function prev(){
  if(!items.length)return;
  pos--;
  if(pos<0)pos=order.length-1;
  showCurrent();
}

function restartSlideshow(){
  clearInterval(slideTimer);
  if(playing && items.length>1){
    slideTimer=setInterval(next,8000);
  }
}

async function loadPhotos(force=false){
  try{
    const res=await fetch(API+'&ts='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);

    const data=await res.json();
    const images=data.filter(f=>f.type==='file' && /\.(jpg|jpeg|png|webp)$/i.test(f.name));
    const newSignature=images.map(f=>f.sha).join('|');

    if(force || newSignature!==signature){
      signature=newSignature;
      items=images.map(f=>({name:f.name,url:f.download_url}));
      count.textContent=items.length;
      status.textContent=items.length+' photo(s) • synchronisation automatique';
      render();
    }

    lastRefresh.textContent=new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
  }catch(err){
    status.textContent='Impossible de lire le dossier photos';
  }
}

setInterval(()=>loadPhotos(false),120000);
loadPhotos(true);

menuBtn.onclick=()=>panel.classList.toggle('open');
closeBtn.onclick=()=>panel.classList.remove('open');
refreshBtn.onclick=()=>loadPhotos(true);

nextBtn.onclick=()=>{next();restartSlideshow()};
prevBtn.onclick=()=>{prev();restartSlideshow()};
pauseBtn.onclick=()=>{
  playing=!playing;
  pauseBtn.textContent=playing?'Pause':'Lecture';
  restartSlideshow();
};

fullBtn.onclick=async()=>{
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
};

function scheduleUiHide(){
  clearTimeout(uiTimer);
  document.body.classList.remove('auto-hide');
  if(document.fullscreenElement){
    uiTimer=setTimeout(()=>document.body.classList.add('auto-hide'),3500);
  }
}

['mousemove','click','touchstart','keydown'].forEach(ev=>{
  document.addEventListener(ev,scheduleUiHide);
});

document.addEventListener('fullscreenchange',()=>{
  fullBtn.textContent=document.fullscreenElement?'⛶ QUITTER':'⛶ PLEIN ÉCRAN';
  scheduleUiHide();
});
</script>
</body>
</html>
