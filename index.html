<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affichage TV FABMEC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#081624;color:#fff}
body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:58px 1fr 40px}
.top,.bottom{display:flex;align-items:center;justify-content:space-between;background:#0b1f33;padding:0 14px}
.title{font-size:20px;font-weight:900}
.small{font-size:11px;color:#b8c8d5}
.right{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:8px;padding:7px 10px;background:#dfeaf1;color:#0b1f33;font-weight:800;cursor:pointer}
.primary{background:#2ea7e0;border:2px solid #fff}
.main{position:relative;min-height:0;padding:8px}
.hero{
  position:absolute;inset:8px;border-radius:14px;overflow:hidden;
  background:
    linear-gradient(rgba(5,17,29,.22),rgba(5,17,29,.22)),
    url("steel_blueprint_bg.png") center/cover no-repeat,
    #0b1f33;
}
.slide{position:absolute;left:0;top:0;width:100%;height:100%;display:none;text-align:center}
.slide.active{display:block}
.slide img{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:100%;max-height:100%;width:auto;height:auto;border:0;
}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(11,31,51,.35)}
.placeholder h1{font-size:44px;margin:0 0 8px}
.caption{position:absolute;left:14px;bottom:12px;z-index:3;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:7px;font-size:11px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:absolute;z-index:50;top:14px;right:14px;width:250px;background:rgba(16,44,69,.98);border-radius:12px;padding:12px;display:none;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.panel.open{display:block}
.info{margin-top:9px;background:rgba(255,255,255,.07);border-radius:9px;padding:8px}
.big{font-size:20px;font-weight:900}
.ui-hidden .top,.ui-hidden .bottom{display:none}
.ui-hidden .app{grid-template-rows:1fr}
.ui-hidden .main{padding:0}
.ui-hidden .hero{inset:0;border-radius:0}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div>
    <div class="title">AFFICHAGE TV FABMEC</div>
    <div class="small">Photos chantier • mode TV LG</div>
  </div>
  <div class="right">
    <span id="clock" class="small"></span>
    <button class="btn primary" id="fullBtn">⛶ PLEIN ÉCRAN</button>
    <button class="btn" id="menuBtn">☰ MENU</button>
  </div>
</header>

<main class="main">
  <section class="hero" id="hero">
    <div class="placeholder"><div><h1>FABMEC</h1><p>Chargement des photos...</p></div></div>
  </section>

  <aside class="panel" id="panel">
    <b>Réglages</b>
    <div class="info">
      <div class="small">Photos détectées</div>
      <div class="big" id="count">0</div>
    </div>
    <div class="info">
      <div class="small">Photos chargées correctement</div>
      <div class="big" id="loadedCount">0</div>
    </div>
    <div class="info">
      <div class="small">Mode</div>
      <b>Aléatoire</b>
    </div>
    <div class="info">
      <div class="small">Dernière vérification</div>
      <span id="lastRefresh">--</span>
    </div>
    <button class="btn primary" id="refreshBtn" style="width:100%;margin-top:10px">↻ Actualiser</button>
    <button class="btn" id="hideUiBtn" style="width:100%;margin-top:7px">Masquer les contrôles</button>
    <button class="btn" id="closeBtn" style="width:100%;margin-top:7px">Fermer</button>
  </aside>
</main>

<footer class="bottom">
  <span class="small" id="status">Connexion...</span>
  <div>
    <button class="btn" id="prevBtn">◀</button>
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn" id="nextBtn">▶</button>
  </div>
</footer>
</div>

<script>
(function(){
var API='https://api.github.com/repos/Antobelle/affichage-tv-fabmec/contents/photos?ref=main';
var hero=document.getElementById('hero');
var count=document.getElementById('count');
var loadedCount=document.getElementById('loadedCount');
var status=document.getElementById('status');
var lastRefresh=document.getElementById('lastRefresh');
var panel=document.getElementById('panel');
var menuBtn=document.getElementById('menuBtn');
var closeBtn=document.getElementById('closeBtn');
var refreshBtn=document.getElementById('refreshBtn');
var fullBtn=document.getElementById('fullBtn');
var pauseBtn=document.getElementById('pauseBtn');
var nextBtn=document.getElementById('nextBtn');
var prevBtn=document.getElementById('prevBtn');
var hideUiBtn=document.getElementById('hideUiBtn');
var clock=document.getElementById('clock');

var items=[];
var order=[];
var pos=0;
var lastIndex=-1;
var slideTimer=null;
var playing=true;
var signature='';
var loaded=0;

function updateClock(){
  var d=new Date();
  clock.innerHTML=d.toLocaleDateString()+' '+d.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

function shuffleCycle(){
  var arr=[],i,j,t;
  for(i=0;i<items.length;i++){arr.push(i);}
  for(i=arr.length-1;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  if(arr.length>1 && arr[0]===lastIndex){
    t=arr[0];arr[0]=arr[1];arr[1]=t;
  }
  order=arr;
  pos=0;
}

function showCurrent(){
  if(!items.length){return;}
  var slides=document.getElementsByClassName('slide');
  var i;
  for(i=0;i<slides.length;i++){slides[i].className='slide';}
  var idx=order[pos];
  var s=document.getElementById('slide-'+idx);
  if(s){s.className='slide active';}
  lastIndex=idx;
}

function render(){
  hero.innerHTML='';
  loaded=0;
  loadedCount.innerHTML='0';

  if(!items.length){
    hero.innerHTML='<div class="placeholder"><div><h1>FABMEC</h1><p>Aucune image trouvée.</p></div></div>';
    return;
  }

  var i;
  for(i=0;i<items.length;i++){
    var s=document.createElement('div');
    s.className='slide';
    s.id='slide-'+i;

    var img=document.createElement('img');
    img.src=items[i].url;
    img.alt=items[i].name;
    img.onload=function(){
      loaded++;
      loadedCount.innerHTML=String(loaded);
    };
    img.onerror=function(){
      status.innerHTML='Une ou plusieurs images ne chargent pas sur ce navigateur.';
    };

    var c=document.createElement('div');
    c.className='caption';
    c.innerHTML=items[i].name;

    s.appendChild(img);
    s.appendChild(c);
    hero.appendChild(s);
  }

  lastIndex=-1;
  shuffleCycle();
  showCurrent();
  restartSlideshow();
}

function next(){
  if(!items.length){return;}
  pos++;
  if(pos>=order.length){shuffleCycle();}
  showCurrent();
}

function prev(){
  if(!items.length){return;}
  pos--;
  if(pos<0){pos=order.length-1;}
  showCurrent();
}

function restartSlideshow(){
  if(slideTimer){clearInterval(slideTimer);}
  if(playing && items.length>1){
    slideTimer=setInterval(next,8000);
  }
}

function photoUrl(name){
  return 'photos/'+encodeURIComponent(name).replace(/%2F/g,'/');
}

function loadPhotos(force){
  var xhr=new XMLHttpRequest();
  xhr.open('GET',API+'&ts='+(new Date().getTime()),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status>=200 && xhr.status<300){
        try{
          var data=JSON.parse(xhr.responseText);
          var images=[];
          var shas=[];
          var i,f;
          for(i=0;i<data.length;i++){
            f=data[i];
            if(f.type==='file' && /\.(jpg|jpeg|png|webp)$/i.test(f.name)){
              images.push({name:f.name,url:photoUrl(f.name)});
              shas.push(f.sha);
            }
          }
          var newSig=shas.join('|');
          if(force || newSig!==signature){
            signature=newSig;
            items=images;
            count.innerHTML=String(items.length);
            status.innerHTML=items.length+' photo(s) • synchronisation automatique';
            render();
          }
          lastRefresh.innerHTML=new Date().toLocaleTimeString();
        }catch(e){
          status.innerHTML='Erreur de lecture de la liste des photos';
        }
      }else{
        status.innerHTML='Impossible de lire le dossier photos';
      }
    }
  };
  xhr.send();
}

setInterval(function(){loadPhotos(false);},120000);
loadPhotos(true);

menuBtn.onclick=function(){panel.className=panel.className==='panel open'?'panel':'panel open';};
closeBtn.onclick=function(){panel.className='panel';};
refreshBtn.onclick=function(){loadPhotos(true);};

nextBtn.onclick=function(){next();restartSlideshow();};
prevBtn.onclick=function(){prev();restartSlideshow();};
pauseBtn.onclick=function(){
  playing=!playing;
  pauseBtn.innerHTML=playing?'Pause':'Lecture';
  restartSlideshow();
};

hideUiBtn.onclick=function(){
  if(document.body.className==='ui-hidden'){
    document.body.className='';
    hideUiBtn.innerHTML='Masquer les contrôles';
  }else{
    document.body.className='ui-hidden';
  }
};

fullBtn.onclick=function(){
  var el=document.documentElement;
  try{
    if(el.requestFullscreen){el.requestFullscreen();}
    else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();}
    else if(el.msRequestFullscreen){el.msRequestFullscreen();}
  }catch(e){}
};
})();
</script>
</body>
</html>
