<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affichage TV FABMEC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081624;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr 44px}
.top,.bottom{
 display:flex;align-items:center;justify-content:space-between;
 background:#0b1f33;padding:0 16px;transition:opacity .35s
}
.title{font-size:21px;font-weight:900}
.sub,.small{font-size:12px;color:#b8c8d5}
.top-right{display:flex;align-items:center;gap:12px}
.btn{border:0;border-radius:9px;padding:8px 11px;background:#dfeaf1;color:#0b1f33;font-weight:800;cursor:pointer}
.btn.primary{background:#2ea7e0;border:2px solid #fff;color:#06243a}
.main{position:relative;min-height:0;padding:10px}
.hero{
 position:absolute;inset:10px;border-radius:16px;overflow:hidden;
 background:
  linear-gradient(rgba(5,17,29,.22),rgba(5,17,29,.22)),
  url("steel_blueprint_bg.png") center/cover no-repeat,
  #0b1f33;
}
.stage{position:absolute;inset:0}
.stage img{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 max-width:100%;max-height:100%;width:auto;height:auto;
 opacity:0;transition:opacity .6s ease
}
.stage img.visible{opacity:1}
.placeholder{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 text-align:center;background:rgba(11,31,51,.22);font-size:20px;font-weight:800
}
.caption{
 position:absolute;left:16px;bottom:14px;background:rgba(0,0,0,.58);
 padding:7px 11px;border-radius:8px;font-size:12px;max-width:70%;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.panel{
 position:absolute;z-index:50;top:18px;right:18px;width:270px;
 background:rgba(16,44,69,.98);border:1px solid rgba(255,255,255,.18);
 border-radius:14px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);
 display:none
}
.panel.open{display:block}
.info{margin-top:10px;padding:9px;background:rgba(255,255,255,.07);border-radius:10px}
.big{font-size:22px;font-weight:900}
.auto-hide .top,.auto-hide .bottom{opacity:0;pointer-events:none}
.auto-hide .app{grid-template-rows:1fr}
.auto-hide .main{padding:0}
.auto-hide .hero{inset:0;border-radius:0}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div>
  <div class="title">AFFICHAGE TV FABMEC</div>
  <div class="sub">Photos chantier • diffusion aléatoire • fond plan structure acier</div>
 </div>
 <div class="top-right">
  <span id="clock" class="small"></span>
  <button class="btn primary" id="fullBtn">⛶ PLEIN ÉCRAN</button>
  <button class="btn" id="menuBtn">☰ MENU</button>
 </div>
</header>

<main class="main">
 <section class="hero">
  <div class="stage">
   <img id="imgA" alt="">
   <img id="imgB" alt="">
  </div>
  <div id="placeholder" class="placeholder">Chargement des photos...</div>
  <div id="caption" class="caption" style="display:none"></div>
 </section>

 <aside id="panel" class="panel">
  <b>Réglages</b>
  <div class="info"><div class="small">Photos détectées</div><div id="count" class="big">0</div></div>
  <div class="info"><div class="small">Photo actuelle</div><div id="current">--</div></div>
  <div class="info"><div class="small">Mode</div><b>Aléatoire stable</b><div class="small">La prochaine photo s'affiche seulement quand elle est prête.</div></div>
  <div class="info"><div class="small">Intervalle</div><b>8 secondes</b></div>
  <div class="info"><div class="small">Dernière vérification</div><div id="lastRefresh">--</div></div>
  <button class="btn primary" id="refreshBtn" style="width:100%;margin-top:12px">↻ Actualiser</button>
  <button class="btn" id="closeBtn" style="width:100%;margin-top:8px">Fermer</button>
 </aside>
</main>

<footer class="bottom">
 <span id="status" class="small">Connexion...</span>
 <div>
  <button class="btn" id="prevBtn">◀</button>
  <button class="btn" id="pauseBtn">Pause</button>
  <button class="btn" id="nextBtn">▶</button>
 </div>
</footer>
</div>

<script>
(function(){
var API='https://api.github.com/repos/Antobelle/affichage-tv-fabmec/contents/photos?ref=main';
var imgA=document.getElementById('imgA');
var imgB=document.getElementById('imgB');
var active=imgA;
var standby=imgB;
var placeholder=document.getElementById('placeholder');
var caption=document.getElementById('caption');
var count=document.getElementById('count');
var current=document.getElementById('current');
var status=document.getElementById('status');
var lastRefresh=document.getElementById('lastRefresh');
var panel=document.getElementById('panel');
var menuBtn=document.getElementById('menuBtn');
var closeBtn=document.getElementById('closeBtn');
var refreshBtn=document.getElementById('refreshBtn');
var fullBtn=document.getElementById('fullBtn');
var pauseBtn=document.getElementById('pauseBtn');
var nextBtn=document.getElementById('nextBtn');
var prevBtn=document.getElementById('prevBtn');
var clockEl=document.getElementById('clock');

var items=[];
var order=[];
var pos=0;
var lastIndex=-1;
var playing=true;
var timer=null;
var signature='';
var uiTimer=null;
var switching=false;

function clock(){
 var d=new Date();
 clockEl.innerHTML=d.toLocaleDateString()+' '+d.toLocaleTimeString();
}
clock();setInterval(clock,1000);

function photoUrl(name){
 return 'photos/'+encodeURIComponent(name);
}

function shuffle(){
 var arr=[],i,j,t;
 for(i=0;i<items.length;i++)arr.push(i);
 for(i=arr.length-1;i>0;i--){
  j=Math.floor(Math.random()*(i+1));
  t=arr[i];arr[i]=arr[j];arr[j]=t;
 }
 if(arr.length>1 && arr[0]===lastIndex){
  t=arr[0];arr[0]=arr[1];arr[1]=t;
 }
 order=arr;pos=0;
}

function currentItem(){
 if(!items.length)return null;
 return items[order[pos]];
}

function swapTo(item,done){
 if(switching)return;
 switching=true;
 var url=photoUrl(item.name);

 standby.onload=function(){
  placeholder.style.display='none';
  standby.className='visible';
  active.className='';

  var tmp=active;
  active=standby;
  standby=tmp;

  standby.onload=null;
  standby.onerror=null;
  standby.src='';

  caption.innerHTML=item.name;
  caption.style.display='block';
  current.innerHTML=item.name;
  lastIndex=order[pos];
  switching=false;
  status.innerHTML=items.length+' photo(s) • affichage stable';
  restartTimer();
  if(done)done(true);
 };

 standby.onerror=function(){
  standby.onload=null;
  standby.onerror=null;
  standby.src='';
  switching=false;
  status.innerHTML='Photo ignorée : '+item.name;
  if(done)done(false);
 };

 standby.src=url;
}

function showFirst(){
 if(!items.length)return;
 placeholder.style.display='flex';
 swapTo(currentItem(),function(ok){
  if(!ok)goNext();
 });
}

function goNext(){
 if(!items.length || switching)return;
 var oldPos=pos;
 pos++;
 if(pos>=order.length)shuffle();
 swapTo(currentItem(),function(ok){
  if(!ok){
   if(pos===oldPos)return;
   setTimeout(goNext,200);
  }
 });
}

function goPrev(){
 if(!items.length || switching)return;
 pos--;
 if(pos<0)pos=order.length-1;
 swapTo(currentItem(),function(ok){
  if(!ok)setTimeout(goPrev,200);
 });
}

function restartTimer(){
 if(timer)clearTimeout(timer);
 timer=null;
 if(playing && items.length>1){
  timer=setTimeout(function(){
   if(!switching)goNext();
  },8000);
 }
}

function loadPhotos(force){
 status.innerHTML='Synchronisation...';
 var xhr=new XMLHttpRequest();
 xhr.open('GET',API+'&ts='+(new Date().getTime()),true);
 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;
  if(xhr.status>=200 && xhr.status<300){
   try{
    var data=JSON.parse(xhr.responseText),images=[],shas=[],i,f;
    for(i=0;i<data.length;i++){
     f=data[i];
     if(f.type==='file' && /\.(jpg|jpeg|png|webp)$/i.test(f.name)){
      images.push({name:f.name});
      shas.push(f.sha);
     }
    }
    var newSig=shas.join('|');
    if(force || newSig!==signature || !items.length){
     signature=newSig;
     items=images;
     count.innerHTML=String(items.length);
     if(items.length){
      lastIndex=-1;
      shuffle();
      active.className='';
      standby.className='';
      active.src='';
      standby.src='';
      showFirst();
     }else{
      placeholder.style.display='flex';
      placeholder.innerHTML='Aucune photo trouvée';
     }
    }else{
     status.innerHTML=items.length+' photo(s) • affichage stable';
    }
    lastRefresh.innerHTML=new Date().toLocaleTimeString();
   }catch(e){
    status.innerHTML='Erreur de lecture des photos';
   }
  }else{
   status.innerHTML='Impossible de lire le dossier photos';
  }
 };
 xhr.send();
}

loadPhotos(true);
setInterval(function(){loadPhotos(false);},300000);

menuBtn.onclick=function(){panel.className=panel.className==='panel open'?'panel':'panel open';};
closeBtn.onclick=function(){panel.className='panel';};
refreshBtn.onclick=function(){loadPhotos(true);};

nextBtn.onclick=function(){
 if(timer)clearTimeout(timer);
 timer=null;
 goNext();
};
prevBtn.onclick=function(){
 if(timer)clearTimeout(timer);
 timer=null;
 goPrev();
};

pauseBtn.onclick=function(){
 playing=!playing;
 pauseBtn.innerHTML=playing?'Pause':'Lecture';
 if(playing)restartTimer();
 else if(timer){clearTimeout(timer);timer=null;}
};

fullBtn.onclick=function(){
 var el=document.documentElement;
 try{
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  else if(el.msRequestFullscreen)el.msRequestFullscreen();
 }catch(e){}
};

function showUi(){
 clearTimeout(uiTimer);
 document.body.className='';
 uiTimer=setTimeout(function(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
   document.body.className='auto-hide';
  }
 },4000);
}
document.onmousemove=showUi;
document.onclick=showUi;
document.ontouchstart=showUi;
})();
</script>
</body>
</html>
